a" text-anchor="middle"><tspan x="259.2" dy="8.5">R2  2 kΩ</tspan></text><text x="162.0" y="-55.300000000000004" dominant-baseline="hanging" fill="#2b5c8a" font-size="8.5" font-family="Helvetica" text-anchor="start"><tspan x="162.0" dy="8.5">ECHO, divided to 3.3 V</tspan></text><text x="3.6" y="81.5" dominant-baseline="hanging" fill="#6b6559" font-size="8.5" font-family="Helvetica" text-anchor="start"><tspan x="3.6" dy="8.5">ECHO idles at 5 V; R1/R2 bring it to 3.3 V for GPIO22. Sensor faces straight down from the</tspan><tspan x="3.6" dy="8.5">brine tank lid, above the highest brine level. In the YAML, 30 cm = full and 50 cm = empty;</tspan><tspan x="3.6" dy="8.5">measure your own tank and change both numbers.</tspan></text><circle cx="259.2" cy="-57.6" r="2.52" style="stroke:#1c1a17;fill:#1c1a17;stroke-width:1.3;stroke-dasharray:-;" /></svg>