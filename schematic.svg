al" fill="#1c1a17" font-size="14" font-family="Helvetica" text-anchor="start"><tspan x="329.40000000000003" dy="14">TRIG</tspan></text><text x="329.40000000000003" y="-129.2" dominant-baseline="central" fill="#1c1a17" font-size="14" font-family="Helvetica" text-anchor="start"><tspan x="329.40000000000003" dy="14">VCC</tspan></text><text x="370.8" y="-154.5" dominant-baseline="ideographic" fill="#1c1a17" font-size="10.5" font-family="Helvetica" text-anchor="middle"><tspan x="370.8" dy="10.5">HC-SR04 ultrasonic</tspan></text><text x="302.40000000000003" y="-142.20000000000002" dominant-baseline="ideographic" fill="#b23a2c" font-size="9" font-family="Helvetica" text-anchor="middle"><tspan x="302.40000000000003" dy="9">+5V</tspan></text><text x="223.2" y="-107.50000000000001" dominant-baseline="central" fill="#2b5c8a" font-size="8.5" font-family="Helvetica" text-anchor="start"><tspan x="223.2" dy="8.5">TRIG</tspan></text><text x="201.6" y="-78.7" dominant-baseline="central" fill="#2b5c8a" font-size="8.5" font-family="Helvetica" text-anchor="start"><tspan x="201.6" dy="8.5">ECHO, wired direct</tspan></text><text x="3.6" y="74.3" dominant-baseline="hanging" fill="#6b6559" font-size="8.5" font-family="Helvetica" text-anchor="start"><tspan x="3.6" dy="8.5">ECHO is a 5 V output driven straight into GPIO22, which is out of spec for the ESP32 but has run</tspan><tspan x="3.6" dy="8.5">since February 2026 without trouble. A 1 kΩ / 2 kΩ divider on ECHO is the by-the-book version.</tspan><tspan x="3.6" dy="8.5">Sensor faces straight down from the brine tank lid, above the highest brine level. In the YAML,</tspan><tspan x="3.6" dy="8.5">30 cm = full and 50 cm = empty; measure your own tank and change both numbers.</tspan></text></svg>